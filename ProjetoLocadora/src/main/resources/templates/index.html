<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Locadora de Filmes - Início</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-center">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="text-center mb-5">
                    <i class="bi bi-film display-1 text-primary"></i>
                    <h1 class="fw-bold mt-3 text-dark">LFS Locadora</h1>
                    <p class="text-muted fs-5">Sistema de Gestão de Locação de Filmes</p>
                </div>

                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-header bg-primary text-white text-center py-3 border-0">
                        <h5 class="mb-0 fw-bold">Menu de Acesso Rápido</h5>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        <div class="d-grid gap-3">
                            <a th:href="@{/locacoes}" class="btn btn-outline-primary btn-lg text-start d-flex align-items-center justify-content-between shadow-sm">
                                <span><i class="bi bi-folder2-open me-2"></i> Locações</span>
                                <i class="bi bi-chevron-right small"></i>
                            </a>
                            
                            <a th:href="@{/filmes}" class="btn btn-outline-dark btn-lg text-start d-flex align-items-center justify-content-between shadow-sm">
                                <span><i class="bi bi-film me-2"></i> Catálogo de Filmes</span>
                                <i class="bi bi-chevron-right small"></i>
                            </a>
                            
                            <a th:href="@{/clientes}" class="btn btn-outline-success btn-lg text-start d-flex align-items-center justify-content-between shadow-sm">
                                <span><i class="bi bi-people me-2"></i> Base de Clientes</span>
                                <i class="bi bi-chevron-right small"></i>
                            </a>
                            
                            <a th:href="@{/pagamentos}" class="btn btn-outline-warning btn-lg text-start d-flex align-items-center justify-content-between shadow-sm">
                                <span><i class="bi bi-credit-card me-2"></i> Pagamentos</span>
                                <i class="bi bi-chevron-right small"></i>
                            </a>
                        </div>

                        <div class="mt-5 text-center">
                            <a th:href="@{/dashboard}" class="btn btn-dark rounded-pill px-5 fw-bold shadow">
                                <i class="bi bi-speedometer2 me-2"></i> Acessar Dashboard
                            </a>
                        </div>
                    </div>
                    <div class="card-footer bg-light text-center py-3 border-0">
                        <small class="text-muted">Versão 1.0.0 &copy; 2025</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
