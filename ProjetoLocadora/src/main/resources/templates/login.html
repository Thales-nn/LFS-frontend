<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - LFS Locadora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100" style="background-color: #0f172a;">
    
    <div class="card border-0 shadow-lg p-4" style="max-width: 400px; width: 100%; border-radius: 15px;">
        <div class="card-body">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-dark">Entrar - LFS</h3>
                <p class="text-muted">Bem-vindo de volta</p>
            </div>

            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Usuário</label>
                    <input type="text" id="username" name="username" class="form-control form-control-lg bg-light" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Senha</label>
                    <input type="password" id="password" name="password" class="form-control form-control-lg bg-light" required>
                </div>
                
                <div th:if="${param.error}" class="alert alert-danger text-center p-2 small">
                    Usuário ou senha inválidos.
                </div>
                <div th:if="${param.logout}" class="alert alert-success text-center p-2 small">
                    Você saiu do sistema.
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-lg fw-bold" style="background-color: #0f172a; border-color: #0f172a;">Entrar</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
