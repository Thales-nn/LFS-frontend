<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Painel Administrativo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <div class="bg-white shadow-sm py-5 text-center mb-4">
        <div class="container">
            <h1 class="display-6 fw-bold text-primary mb-2">Painel Administrativo - LFS</h1>
            <img th:src="@{/images/logo.png}" alt="Logo Locadora FLS" class="img-fluid d-block mx-auto w-25 mb-4">
            <p class="text-muted mb-0">
                Bem-vindo, <strong th:text="${userName}">Nome</strong> 
                <span class="badge bg-dark ms-2" th:text="${userRole}">Role</span>
            </p>
        </div>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-5">
                        <h5 class="card-title text-center text-secondary mb-4">Acessar Funcionalidades</h5>
                        
                        <div class="row g-3">
                            <div class="col-md-6">
                                <a th:href="@{/locacoes}" class="btn btn-outline-primary w-100 py-3 d-flex align-items-center justify-content-center gap-2">
                                    <i class="bi bi-folder2-open fs-5"></i> Gerenciar Locações
                                </a>
                            </div>
                            <div class="col-md-6">
                                <a th:href="@{/filmes}" class="btn btn-outline-dark w-100 py-3 d-flex align-items-center justify-content-center gap-2">
                                    <i class="bi bi-film fs-5"></i> Gerenciar Filmes
                                </a>
                            </div>
                            <div class="col-md-6">
                                <a th:href="@{/clientes}" class="btn btn-outline-success w-100 py-3 d-flex align-items-center justify-content-center gap-2">
                                    <i class="bi bi-people fs-5"></i> Gerenciar Clientes
                                </a>
                            </div>
                            <div class="col-md-6">
                                <a th:href="@{/pagamentos}" class="btn btn-outline-warning w-100 py-3 d-flex align-items-center justify-content-center gap-2">
                                    <i class="bi bi-credit-card fs-5"></i> Pagamentos
                                </a>
                            </div>
                            <div class="col-md-12">
                                <a th:href="@{/relatorios}" class="btn btn-outline-info w-100 py-3 d-flex align-items-center justify-content-center gap-2">
                                    <i class="bi bi-file-text fs-5"></i> Relatórios
                                </a>
                            </div>
                        </div>

                        <div class="mt-5 text-center border-top pt-4">
                            <div class="d-flex justify-content-center gap-2">
                                <a th:if="${#authorization.expression('hasRole(''ADMINISTRADOR'')')}" 
                                   th:href="@{/usuarios/novo}" class="btn btn-primary rounded-pill px-4">
                                    <i class="bi bi-person-plus"></i> Novo Usuário
                                </a>
                                <a th:href="@{/dashboard}" class="btn btn-dark rounded-pill px-4">
                                    <i class="bi bi-speedometer2"></i> Dashboard
                                </a>
                                <form th:action="@{/logout}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-danger rounded-pill px-4">
                                        Sair
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <nav class="navbar fixed-bottom navbar-dark bg-primary py-2 justify-content-center">
        <span class="text-white small">LFS Locadora © 2025</span>
    </nav>

</body>
</html>
