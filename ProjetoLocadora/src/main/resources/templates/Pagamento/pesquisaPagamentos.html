<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Pagamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/home">LFS Locadora</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/locacoes}">Locações</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/filmes}">Filmes</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/clientes}">Clientes</a></li>
                    <li class="nav-item"><a class="nav-link active" th:href="@{/pagamentos}">Pagamentos</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-secondary">Pagamentos</h2>
            <div class="d-flex gap-2">
                <a th:href="${urlRelatorio}" target="_blank" class="btn btn-outline-danger d-flex align-items-center gap-2">
                    <i class="bi bi-file-pdf"></i> Relatório
                </a>
                <a th:href="@{/pagamentos/novo}" class="btn btn-primary d-flex align-items-center gap-2 shadow-sm">
                    <i class="bi bi-plus-circle"></i> Novo Pagamento
                </a>
            </div>
        </div>

        <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0 align-middle">
                        <thead class="bg-primary text-white">
                            <tr>
                                <th class="py-3 ps-4">ID</th>
                                <th class="py-3">Referência</th>
                                <th class="py-3">Data Pagto</th>
                                <th class="py-3">Valor</th>
                                <th class="py-3">Forma</th>
                                <th class="py-3">Status</th>
                                <th class="py-3 text-end pe-4">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                             <tr th:if="${pagamentos == null or pagamentos.empty}">
                                <td colspan="7" class="text-center py-4 text-muted">Nenhum pagamento encontrado.</td>
                            </tr>
                            <tr th:each="pagamento : ${pagamentos}">
                                <td class="ps-4 fw-bold" th:text="${pagamento.id}"></td>
                                <td th:text="${'Locação #' + pagamento.locacao.id}"></td>
                                <td th:text="${#dates.format(pagamento.dataPagamento, 'dd/MM/yyyy')}"></td>
                                <td th:text="${#numbers.formatDecimal(pagamento.valor,1,'COMMA',2,'POINT')}"></td>
                                <td th:text="${pagamento.formaDePagamento != null ? #strings.capitalize(pagamento.formaDePagamento.name().replace('_', ' ').toLowerCase()) : '-'}"></td>
                                <td>
                                    <span class="badge rounded-pill"
                                          th:classappend="${pagamento.status} ? 'bg-success' : 'bg-warning text-dark'"
                                          th:text="${pagamento.status} ? 'Pago' : 'Pendente'">
                                    </span>
                                </td>
                                <td class="text-end pe-4">
                                    <a th:href="@{/pagamentos/editar/{id}(id=${pagamento.id})}" class="btn btn-sm btn-outline-primary me-1">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <a th:href="@{/pagamentos/excluir/{id}(id=${pagamento.id})}" class="btn btn-sm btn-outline-danger"
                                       onclick="return confirm('Excluir este pagamento?')">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
