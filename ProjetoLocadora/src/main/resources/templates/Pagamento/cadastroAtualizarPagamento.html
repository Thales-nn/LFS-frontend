<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${pagamento.id} != null ? 'Editar Pagamento' : 'Novo Pagamento'">Pagamento</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                    <h3 class="fw-bold text-primary" th:text="${pagamento.id} != null ? 'Editar Pagamento' : 'Novo Pagamento'"></h3>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/pagamentos/salvar}" th:object="${pagamento}" method="post">
                      <input type="hidden" th:field="*{id}" />

                      <div class="row g-3 mb-3">
                        <div class="col-md-6">
                          <label class="form-label fw-semibold">Locação Vinculada</label>
                          <select th:field="*{locacao.id}" class="form-select bg-light" required>
                            <option value="" disabled th:if="${pagamento.locacao == null}">Selecione...</option>
                            <option th:each="loc : ${locacoes}"
                                    th:value="${loc.id}"
                                    th:text="${'Locação #' + loc.id + ' - ' + loc.cliente.nome}"></option>
                          </select>
                        </div>
                        <div class="col-md-6">
                          <label class="form-label fw-semibold">Data Vencimento</label>
                          <input type="date" class="form-control bg-light" th:field="*{dataVencimento}" required />
                        </div>
                      </div>

                      <div class="row g-3 mb-3">
                        <div class="col-md-6">
                          <label class="form-label fw-semibold">Data Pagamento</label>
                          <input type="date" class="form-control bg-light" th:field="*{dataPagamento}" />
                        </div>
                        <div class="col-md-6">
                          <label class="form-label fw-semibold">Valor</label>
                          <div class="input-group">
                              <span class="input-group-text bg-light border-end-0">R$</span>
                              <input type="number" step="0.01" class="form-control bg-light border-start-0" th:field="*{valor}" required />
                          </div>
                        </div>
                      </div>

                      <div class="row g-3 mb-4">
                        <div class="col-md-6">
                          <label class="form-label fw-semibold">Forma de Pagamento</label>
                          <select th:field="*{formaDePagamento}" class="form-select bg-light" required>
                              <option value="" disabled th:if="${pagamento.formaDePagamento == null}">Selecione...</option>
                              <option th:each="fp : ${formas}"
                                      th:value="${fp.name()}"
                                      th:text="${#strings.capitalize(fp.name().replace('_',' ').toLowerCase())}"></option>
                        </select>
                        </div>
                        <div class="col-md-6">
                          <label class="form-label fw-semibold">Status</label>
                          <select th:field="*{status}" class="form-select bg-light" required>
                            <option value="" disabled selected>Selecione...</option>
                            <option th:value="true">Pago</option>
                            <option th:value="false">Pendente</option>
                          </select>
                        </div>
                      </div>

                      <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/pagamentos}" class="btn btn-outline-secondary px-4">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-4 fw-bold">Salvar Pagamento</button>
                      </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
  </div>
</body>
</html>
