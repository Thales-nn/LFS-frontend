<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Filmes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/home">LFS Locadora</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/locacoes}">Locações</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/clientes}">Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/pagamentos}">Pagamentos</a></li>
                    <li class="nav-item"><a class="nav-link active" th:href="@{/filmes}">Filmes</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        
        <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${erro}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${sucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-secondary">Filmes Cadastrados</h2>
            <div class="d-flex gap-2">
                <a th:href="${urlRelatorio}" target="_blank" class="btn btn-outline-danger d-flex align-items-center gap-2">
                    <i class="bi bi-file-pdf"></i> Relatório
                </a>
                <a th:href="@{/filmes/novo}" class="btn btn-primary d-flex align-items-center gap-2 shadow-sm">
                    <i class="bi bi-plus-circle"></i> Novo Filme
                </a>
            </div>
        </div>

        <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0 align-middle">
                        <thead class="bg-primary text-white">
                            <tr>
                                <th class="py-3 ps-4">ID</th>
                                <th class="py-3">Título</th>
                                <th class="py-3">Diretor</th>
                                <th class="py-3">Gênero</th>
                                <th class="py-3">Ano</th>
                                <th class="py-3">Valor</th>
                                <th class="py-3">Status</th>
                                <th class="py-3 text-end pe-4">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${filmes == null or filmes.empty}">
                                <td colspan="8" class="text-center py-4 text-muted">Nenhum filme encontrado.</td>
                            </tr>
                            <tr th:each="filme : ${filmes}">
                                <td class="ps-4 fw-bold" th:text="${filme.id}"></td>
                                <td th:text="${filme.titulo}"></td>
                                <td th:text="${filme.diretor}"></td>
                                <td th:text="${filme.genero}"></td>
                                <td th:text="${filme.anoLancamento}"></td>
                                <td th:text="${#numbers.formatCurrency(filme.valorLocacao)}"></td>
                                <td>
                                    <span class="badge rounded-pill" 
                                          th:classappend="${filme.statusFilme.name() == 'DISPONIVEL' ? 'bg-success' : (filme.statusFilme.name() == 'LOCADO' ? 'bg-warning text-dark' : 'bg-danger')}"
                                          th:text="${filme.statusFilme}">
                                    </span>
                                </td>
                                <td class="text-end pe-4">
                                    <a th:href="@{/filmes/editar/{id}(id=${filme.id})}" class="btn btn-sm btn-outline-primary me-1">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <a th:href="@{/filmes/excluir/{id}(id=${filme.id})}" class="btn btn-sm btn-outline-danger" 
                                       onclick="return confirm('Tem certeza que deseja excluir este filme?')">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
