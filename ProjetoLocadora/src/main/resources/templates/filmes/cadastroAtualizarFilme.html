<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${filme.id} ? 'Editar Filme' : 'Novo Filme'">Filme</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                        <h3 class="fw-bold text-primary" th:text="${filme.id} ? 'Editar Filme' : 'Novo Filme'"></h3>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/filmes}" th:object="${filme}" method="post">
                            <input type="hidden" th:field="*{id}" />

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Título</label>
                                    <input type="text" class="form-control bg-light" th:field="*{titulo}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Diretor</label>
                                    <input type="text" class="form-control bg-light" th:field="*{diretor}" required>
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Gênero</label>
                                    <input type="text" class="form-control bg-light" th:field="*{genero}" required>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label fw-semibold">Ano</label>
                                    <input type="number" class="form-control bg-light" th:field="*{anoLancamento}" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label fw-semibold">Valor Locação</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0">R$</span>
                                        <input type="number" step="0.01" class="form-control bg-light border-start-0" th:field="*{valorLocacao}" required>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label fw-semibold">Status</label>
                                    <select class="form-select bg-light" th:field="*{statusFilme}">
                                        <option th:each="status : ${T(com.locadorafilmes.locadora.enums.StatusFilme).values()}"
                                                th:value="${status}"
                                                th:text="${status}">
                                        </option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Sinopse</label>
                                <textarea class="form-control bg-light" th:field="*{sinopse}" rows="3"></textarea>
                            </div>

                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/filmes}" class="btn btn-outline-secondary px-4">Cancelar</a>
                                <button type="submit" class="btn btn-primary px-4 fw-bold">Salvar Dados</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
