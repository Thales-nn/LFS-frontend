<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${cliente.id} ? 'Editar Cliente' : 'Novo Cliente'">Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                        <h3 class="fw-bold text-primary" th:text="${cliente.id} ? 'Editar Cliente' : 'Novo Cliente'"></h3>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/clientes}" th:object="${cliente}" method="post">
                            <input type="hidden" th:field="*{id}"/>
                            
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Nome Completo</label>
                                    <input type="text" class="form-control bg-light" th:field="*{nome}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">CPF</label>
                                    <input type="text" class="form-control bg-light" th:field="*{cpf}" required>
                                </div>
                            </div>
                            
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Telefone</label>
                                    <input type="text" class="form-control bg-light" th:field="*{telefone}">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">E-mail</label>
                                    <input type="email" class="form-control bg-light" th:field="*{email}">
                                </div>
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Categoria</label>
                                    <select class="form-select bg-light" th:field="*{categoria}">
                                        <option th:each="c : ${T(com.locadorafilmes.locadora.enums.TiposDeCliente).values()}"
                                                th:value="${c}" th:text="${c}"></option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/clientes}" class="btn btn-outline-secondary px-4">Cancelar</a>
                                <button type="submit" class="btn btn-primary px-4 fw-bold">Salvar Dados</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
