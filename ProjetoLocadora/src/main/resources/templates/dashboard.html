<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-light pb-5">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">LFS Locadora</a>
            <div class="d-flex gap-3">
                <a href="/home" class="btn btn-sm btn-outline-light rounded-pill px-3">Voltar</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row g-4 mb-5">
            <div class="col-md-4">
                <div class="card text-white bg-primary h-100 border-0 shadow">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <h6 class="card-title text-uppercase opacity-75">Filmes no Catálogo</h6>
                                <h2 class="display-4 fw-bold mb-0" th:text="${filmesDisponiveis}">0</h2>
                            </div>
                            <i class="bi bi-film fs-1 opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-dark h-100 border-0 shadow">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <h6 class="card-title text-uppercase opacity-75">Locações Ativas</h6>
                                <h2 class="display-4 fw-bold mb-0" th:text="${totalLocacoes}">0</h2>
                            </div>
                            <i class="bi bi-folder2-open fs-1 opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-success h-100 border-0 shadow">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <h6 class="card-title text-uppercase opacity-75">Clientes Ativos</h6>
                                <h2 class="display-4 fw-bold mb-0" th:text="${totalClientes}">0</h2> 
                            </div>
                            <i class="bi bi-people fs-1 opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white py-3 border-0">
                <h5 class="mb-0 fw-bold text-secondary"><i class="bi bi-clock-history me-2"></i>Últimas Locações</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4 py-3">ID</th>
                                <th>Cliente</th>
                                <th>Filme</th>
                                <th>Valor</th>
                                <th>Data</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="locacao : ${ultimasLocacoes}">
                                <td class="ps-4 fw-bold" th:text="${locacao.id}"></td>
                                <td th:text="${locacao.cliente.nome}"></td>
                                <td th:text="${locacao.filme.titulo}"></td>
                                <td th:text="${#numbers.formatCurrency(locacao.valor)}"></td>
                                <td th:text="${#dates.format(locacao.dataLocacao, 'dd/MM/yyyy')}"></td>
                            </tr>
                             <tr th:if="${ultimasLocacoes == null or ultimasLocacoes.empty}">
                                <td colspan="5" class="text-center py-4 text-muted">Nenhum registro encontrado.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
