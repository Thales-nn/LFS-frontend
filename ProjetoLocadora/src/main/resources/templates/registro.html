<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Usuário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center min-vh-100 py-5" style="background-color: #0f172a;">

    <div class="card border-0 shadow-lg p-4" style="max-width: 500px; width: 100%; border-radius: 15px;">
        <div class="card-body">
            <h3 class="text-center fw-bold mb-4 text-dark">Novo Usuário</h3>
            
            <form th:action="@{/usuarios/salvar}" th:object="${usuario}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nome Completo</label>
                    <input type="text" th:field="*{nome}" class="form-control bg-light" required />
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Usuário</label>
                    <input type="text" th:field="*{username}" class="form-control bg-light" required />
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Senha</label>
                    <input type="password" th:field="*{senha}" class="form-control bg-light" required />
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">CPF</label>
                        <input type="text" th:field="*{cpf}" class="form-control bg-light" />
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" th:field="*{email}" class="form-control bg-light" />
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Função</label>
                    <select th:field="*{role}" class="form-select bg-light">
                        <option th:value="ADMINISTRADOR">Administrador</option>
                        <option th:value="FUNCIONARIO">Funcionário</option>
                    </select>
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary fw-bold" style="background-color: #0f172a; border-color: #0f172a;">Cadastrar</button>
                    <a th:href="@{/home}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
