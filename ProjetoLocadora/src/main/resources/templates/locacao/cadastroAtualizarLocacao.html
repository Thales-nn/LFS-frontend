<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <title th:text="${locacao.id} != null ? 'Editar Locação' : 'Nova Locação'">Locação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                        <h3 class="fw-bold text-primary" th:text="${locacao.id} != null ? 'Editar Locação' : 'Nova Locação'"></h3>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/locacoes/salvar}" th:object="${locacao}" method="post">
                            <input type="hidden" th:field="*{id}" />
                            
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Filme</label>
                                    <select class="form-select bg-light" th:field="*{filme.id}" required>
                                        <option value="" disabled>Selecione um filme</option>
                                        <option th:each="filme : ${formData.filmes}" th:value="${filme.id}" th:text="${filme.titulo}"></option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Cliente</label>
                                    <select class="form-select bg-light" th:field="*{cliente.id}" required>
                                        <option value="" disabled>Selecione um cliente</option>
                                        <option th:each="cliente : ${formData.clientes}" th:value="${cliente.id}" th:text="${cliente.nome}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                <label for="usuario" class="form-label fw-semibold">Funcionário</label>
                
                <div sec:authorize="hasRole('ADMINISTRADOR')">
                    <select id="usuario" class="form-select bg-light" th:field="*{usuario.id}">
                        <option value="" disabled>Selecione um funcionário</option>
                        <option th:each="usuario : ${formData.usuarios}" 
                                th:value="${usuario.id}" 
                                th:text="${usuario.nome}"></option>
                    </select>
                </div>

                <div sec:authorize="hasRole('FUNCIONARIO')">
                    <input type="text" class="form-control bg-light" 
                           th:value="${#authentication.principal.username}" disabled readonly />
                    <small class="text-muted">Locação será registrada em seu nome.</small>
                </div>
            </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Valor Total</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0">R$</span>
                                        <input type="number" step="0.01" class="form-control bg-light border-start-0" th:field="*{valor}" required />
                                    </div>
                                </div>
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Data Locação</label>
                                    <input type="date" class="form-control bg-light" th:field="*{dataLocacao}" required />
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Data Devolução</label>
                                    <input type="date" class="form-control bg-light" th:field="*{dataDevolucao}" />
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/locacoes}" class="btn btn-outline-secondary px-4">Cancelar</a>
                                <button type="submit" class="btn btn-primary px-4 fw-bold">Salvar Locação</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
